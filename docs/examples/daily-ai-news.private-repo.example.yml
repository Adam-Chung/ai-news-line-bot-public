name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      line_test_mode:
        description: "Send a LINE test message without calling Gemini"
        required: true
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC. 01:30 UTC is 09:30 in Asia/Taipei.
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Generate and deliver the digest
        run: npm start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODEL: gemini-3.1-flash-lite
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID_001: ${{ secrets.LINE_TARGET_ID_001 }}
          SOURCE_USER_AGENT: ${{ vars.SOURCE_USER_AGENT }}
          LINE_TEST_MODE: ${{ inputs.line_test_mode || 'false' }}

      # Use this example only in a Private repository. Runtime state can
      # contain complete messages, URLs, recipient aliases, and hashes.
      - name: Persist private runtime state
        if: always()
        run: |
          state_files=()
          for file in data/delivery-history.json data/run-diagnostics.json data/sent-items.json; do
            if [[ -f "$file" ]]; then
              state_files+=("$file")
            fi
          done
          if (( ${#state_files[@]} == 0 )); then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "${state_files[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update AI news delivery state"
          git push
